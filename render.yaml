# Render.com Blueprint for 100% Free Hosting
services:
  # ─── Backend Web Service (Free Tier) ────────────────────────────────────────
  - type: web
    name: hms-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with your free MongoDB Atlas connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_MAX
        value: 200
      - key: CLIENT_URL
        sync: false # Set to your deployed frontend URL

  # ─── Frontend Static Site (Free Tier) ───────────────────────────────────────
  - type: web
    name: hms-frontend-portal
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://hms-backend-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        sync: false # Set to https://hms-backend-api.onrender.com
