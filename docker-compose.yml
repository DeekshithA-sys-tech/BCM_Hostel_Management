services:
  # ─── Database Service ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: hms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hms-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Backend API & WebSocket Service ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/hostel_management
      - JWT_ACCESS_SECRET=prod_access_secret_change_in_env_file_987654321
      - JWT_REFRESH_SECRET=prod_refresh_secret_change_in_env_file_123456789
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - UPLOAD_DIR=uploads
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hms-net

  # ─── Frontend Nginx Reverse Proxy Service ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_SOCKET_URL=/
    container_name: hms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hms-net

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  hms-net:
    driver: bridge
